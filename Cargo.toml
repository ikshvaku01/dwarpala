[workspace]
resolver       = "2"
members        = ["community", "enterprise", "tools/sign_license"]
default-members = ["enterprise"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.93"
repository   = "https://github.com/your-org/dwarpala"

[workspace.dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
walkdir = "2.5.0"
notify = { version = "8.2.0", features = [] }
notify-debouncer-mini = "0.7.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8"
rand_core = "0.10.0"
base64 = "0.22.1"
sha2 = "0.10.9"

[profile.release]
opt-level     = "z"
strip         = true
lto           = true
codegen-units = 1